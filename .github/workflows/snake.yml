name: Snake Contribution Graph

on:
  workflow_dispatch:
  schedule:
    # 每天 18:17 UTC（北京时间次日 02:17）
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Move generated files
        run: |
          mkdir -p profile-snake-contrib
          cp dist/github-contribution-grid-snake.svg profile-snake-contrib/
          cp dist/github-contribution-grid-snake-dark.svg profile-snake-contrib/

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-snake-contrib
          if git diff --cached --quiet; then
            echo "Snake files unchanged."
          else
            git commit -m "chore: update contribution snake"
            git push
          fi
